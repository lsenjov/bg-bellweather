    <text class="tracker-note" x="60" y="1012">25 MM MARKERS</text>
    <text class="tracker-note" x="60" y="1098">0 → 10</text>
    <text class="tracker-note" x="60" y="1120">20 ← 11</text>
    <text class="tracker-note" x="60" y="1154">OUTSIDE = NOTE TOTAL</text>
