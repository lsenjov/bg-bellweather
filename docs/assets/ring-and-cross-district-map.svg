<svg xmlns="http://www.w3.org/2000/svg" width="396mm" height="297mm" viewBox="0 0 1600 1200" role="img" aria-labelledby="title description">
  <title id="title">Territorial district map of Bellweather</title>
  <desc id="description">Sixteen named districts form an irregular land ring and three causeways across Crownwater to Bellweather Centre. Shared black borders define adjacency. Clockwise from north, the outer ring is Northreach with 2 Support spots, Cloverfield with 4, Harbormouth with 6, Millbank with 4, Reedwater with 2, Sunmeadow with 4, Grand Market with 6, Red Orchard with 4, Westgate with 2, Mossfield with 4, Ironwood with 6, and High Pastures with 4. Crown Road has 2 spots and borders Harbormouth and Bellweather Centre. Canal Ward has 2 spots and borders Grand Market and Bellweather Centre. Old Quarter has 2 spots and borders Ironwood and Bellweather Centre. Bellweather Centre has 3 spots and borders the three causeways. A compact right-side tracker holds three reciprocal coalition pairs and reserves unpaired party tokens.</desc>
  <defs>
    <pattern id="water" width="52" height="28" patternUnits="userSpaceOnUse">
      <rect width="52" height="28" fill="#c9d9da"/>
      <path d="M-8 17Q5 7 18 17T44 17T70 17" fill="none" stroke="#91afb0" stroke-width="3"/>
    </pattern>
    <g id="support-spot">
      <circle r="20" fill="#f2eadb" stroke="#171612" stroke-width="4"/>
    </g>
  </defs>
  <style>
    .paper { fill: #f2eadb; }
    .district { stroke: #171612; stroke-linejoin: round; stroke-width: 6; }
    .district-two { fill: #fffaf0; }
    .district-four { fill: #d8dfcf; }
    .district-six { fill: #898985; }
    .district-center { fill: #f2bc3b; stroke-width: 9; }
    .region-name { fill: #171612; font: 900 25px "Noto Serif", serif; letter-spacing: -0.4px; text-anchor: middle; }
    .region-name-small { font-size: 22px; }
    .region-name-centre { font-size: 12px; letter-spacing: 0; }
    .heading { fill: #171612; font: 900 38px "Noto Serif", serif; letter-spacing: -1px; }
    .eyebrow { fill: #9f2c1e; font: 900 15px "Noto Sans Mono", monospace; letter-spacing: 3px; }
    .map-note { fill: #625f57; font: 900 14px "Noto Sans Mono", monospace; letter-spacing: 2px; }
    .water-label { fill: #314e54; font: italic 900 15px "Noto Serif", serif; letter-spacing: 4px; text-anchor: middle; }
    .coalition-tracker-frame { fill: #fffaf0; stroke: #171612; stroke-width: 4; }
    .coalition-tracker-title { fill: #171612; font: 900 17px "Noto Sans Mono", monospace; letter-spacing: 2px; text-anchor: middle; }
    .coalition-pair-line { stroke: #171612; stroke-width: 7; }
    .coalition-token-well { fill: #f2eadb; stroke: #171612; stroke-width: 4; }
    .coalition-reserve-label { fill: #625f57; font: 900 13px "Noto Sans Mono", monospace; letter-spacing: 1.5px; text-anchor: middle; text-transform: uppercase; }
    .registration { fill: none; stroke: #d9432f; stroke-width: 3; }
  </style>

