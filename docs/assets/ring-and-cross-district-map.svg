  <path class="registration" d="M28 52V28h24 M1548 28h24v24 M28 1172v18h24 M1548 1190h24v-18"/>
  <text class="eyebrow" x="60" y="62">REPUBLIC OF BELLWETHER / DISTRICT ATLAS 01</text>
  <text class="heading" x="60" y="103">The sixteen districts</text>
  <text class="map-note" x="1540" y="62" text-anchor="end">16 DISTRICTS / 57 SUPPORT SPOTS</text>

  <g class="map-art" transform="translate(50 70) scale(.76)">
  <ellipse cx="800" cy="610" rx="375" ry="305" fill="url(#water)" stroke="#171612" stroke-width="5"/>

