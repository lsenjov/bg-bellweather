    <g transform="translate(1230 278)">
      <text class="tracker-cycle" x="52" y="-8">ELECTION 1</text>
      <text class="tracker-cycle" x="163" y="-8">ELECTION 2</text>
      <text class="tracker-cycle" x="274" y="-8">ELECTION 3</text>
      <g><rect class="tracker-rail" width="104" height="104"/><text class="tracker-value" x="52" y="52">R1</text></g>
