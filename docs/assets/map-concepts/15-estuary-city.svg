<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1020" role="img" aria-labelledby="title desc">
<title id="title">15. Estuary city — experimental Bellweather map</title>
<desc id="desc">The river widens toward the coast, leaving both crossings upstream. A campaign on the lower opposite bank requires a substantial inland detour. Only printed routes define adjacency for every effect. District footprints and route intersections create no additional links. Three regions hold eighteen Support each; Bellweather holds three separately.</desc>
