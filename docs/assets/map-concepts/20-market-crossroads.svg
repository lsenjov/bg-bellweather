<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1020" role="img" aria-labelledby="title desc">
<title id="title">20. Market crossroads — experimental Bellweather map</title>
<desc id="desc">Four market approaches meet at Bellweather, with outer settlement routes that can bypass the central crossroads. Only printed routes define adjacency for every effect. District footprints and route intersections create no additional links. Three regions hold eighteen Support each; Bellweather holds three separately.</desc>
