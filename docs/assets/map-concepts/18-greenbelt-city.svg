<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1020" role="img" aria-labelledby="title desc">
<title id="title">18. Greenbelt city — experimental Bellweather map</title>
<desc id="desc">An urban core is separated from satellite settlements by a greenbelt. Four access corridors connect different parts of the core to the outer circuit. Only printed routes define adjacency for every effect. District footprints and route intersections create no additional links. Three regions hold eighteen Support each; Bellweather holds three separately.</desc>
