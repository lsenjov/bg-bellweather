<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1020" role="img" aria-labelledby="title desc">
<title id="title">4. River delta — experimental Bellweather map</title>
<desc id="desc">Four inhabited delta islands form a circuit. A party can approach an island from either neighboring island, but cannot jump between diagonal islands. Only printed routes define adjacency for every effect. District footprints and route intersections create no additional links. Three regions hold eighteen Support each; Bellweather holds three separately.</desc>
