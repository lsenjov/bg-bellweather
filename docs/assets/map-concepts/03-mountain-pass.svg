<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1020" role="img" aria-labelledby="title desc">
<title id="title">3. Mountain pass — experimental Bellweather map</title>
<desc id="desc">Two inhabited passes connect the valleys; a longer southern foothill route provides a third approach around the mountains. Only printed routes define adjacency for every effect. District footprints and route intersections create no additional links. Three regions hold eighteen Support each; Bellweather holds three separately.</desc>
