<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1020" role="img" aria-labelledby="title desc">
<title id="title">17. Industrial belt — experimental Bellweather map</title>
<desc id="desc">Large industrial sites leave two service corridors between east and west. Districts on either side of a factory are not automatically adjacent. Only printed routes define adjacency for every effect. District footprints and route intersections create no additional links. Three regions hold eighteen Support each; Bellweather holds three separately.</desc>
