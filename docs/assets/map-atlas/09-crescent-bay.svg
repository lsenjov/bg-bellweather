<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1020" role="img" aria-labelledby="title desc">
<title id="title">9. Crescent bay — experimental Bellweather map</title>
<desc id="desc">An inner coastal route and an outer inland route follow the same broad bay. Connections between them allow players to change approach without crossing water. Only printed routes define adjacency for every effect. District footprints and route intersections create no additional links. Three regions hold eighteen Support each; Bellweather holds three separately.</desc>
