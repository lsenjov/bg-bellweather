<text x="40" y="959" font-size="13">Nearby footprints are not adjacent. Double-railed spans mark bridges, gates, passes, or viaducts.</text>
<text x="40" y="984" font-size="13">Experimental concept · 26 connections · 2 dead-end districts: see study notes · District elections remain local</text>
