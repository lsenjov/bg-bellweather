<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1020" role="img" aria-labelledby="title desc">
<title id="title">7. Peninsula capital — experimental Bellweather map</title>
<desc id="desc">The urban port occupies a peninsula behind two approaches from the mainland. Bellweather sits near its tip, while the broader scoring landscape remains inland. Only printed routes define adjacency for every effect. District footprints and route intersections create no additional links. Three regions hold eighteen Support each; Bellweather holds three separately.</desc>
