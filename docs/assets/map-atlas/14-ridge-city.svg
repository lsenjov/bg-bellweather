<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1020" role="img" aria-labelledby="title desc">
<title id="title">14. Ridge city — experimental Bellweather map</title>
<desc id="desc">The urban districts form a ridge-top route above two lower neighborhoods. Several hillside approaches connect the slopes to different ridge districts. Only printed routes define adjacency for every effect. District footprints and route intersections create no additional links. Three regions hold eighteen Support each; Bellweather holds three separately.</desc>
