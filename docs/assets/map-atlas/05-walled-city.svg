<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1020" role="img" aria-labelledby="title desc">
<title id="title">5. Walled city — experimental Bellweather map</title>
<desc id="desc">Four gates connect a compact old city to an outer circuit. Different gates give access to different inner districts. Only printed routes define adjacency for every effect. District footprints and route intersections create no additional links. Three regions hold eighteen Support each; Bellweather holds three separately.</desc>
