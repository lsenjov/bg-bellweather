<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1020" role="img" aria-labelledby="title desc">
<title id="title">10. Railway junction — experimental Bellweather map</title>
<desc id="desc">Intersecting rail corridors divide the city into four sectors. Road viaducts connect the sectors in a circuit away from the rail junction. Only printed routes define adjacency for every effect. District footprints and route intersections create no additional links. Three regions hold eighteen Support each; Bellweather holds three separately.</desc>
