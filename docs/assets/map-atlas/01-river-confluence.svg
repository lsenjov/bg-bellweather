<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1020" role="img" aria-labelledby="title desc">
<title id="title">1. River confluence — experimental Bellweather map</title>
<desc id="desc">Three banks form separate campaign areas. Two crossings approach Bellweather; a downstream crossing links the outer banks without using the centre. Only printed routes define adjacency for every effect. District footprints and route intersections create no additional links. Three regions hold eighteen Support each; Bellweather holds three separately.</desc>
