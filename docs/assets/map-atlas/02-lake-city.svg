<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1020" role="img" aria-labelledby="title desc">
<title id="title">2. Lake city — experimental Bellweather map</title>
<desc id="desc">A continuous shoreline offers clockwise and anticlockwise approaches to the same targets, while the lake removes direct shortcuts across the middle. Only printed routes define adjacency for every effect. District footprints and route intersections create no additional links. Three regions hold eighteen Support each; Bellweather holds three separately.</desc>
